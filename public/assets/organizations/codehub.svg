<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="codehub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="codehub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="#0c172e"/>
  <circle cx="200" cy="120" r="90" fill="url(#codehub-glow)"/>
  <rect x="30" y="30" width="340" height="180" rx="16" fill="#132240" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Terminal Header -->
  <circle cx="56" cy="54" r="5" fill="#ef4444"/>
  <circle cx="72" cy="54" r="5" fill="#f59e0b"/>
  <circle cx="88" cy="54" r="5" fill="#10b981"/>
  <line x1="30" y1="72" x2="370" y2="72" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Icon: Code Brackets & Hub -->
  <path d="M 160 115 L 140 130 L 160 145" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 240 115 L 260 130 L 240 145" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="130" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="200" cy="130" r="5" fill="#ffffff"/>

  <!-- Text -->
  <text x="200" y="180" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">CODEHUB ESA UNGGUL</text>
  <text x="200" y="198" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">TECH COMMUNITY &amp; DEV LAB</text>
</svg>
